<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.124/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #c { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
    .cesium-widget-credits, .cesium-viewer-bottom, .cesium-viewer-toolbar,
    .cesium-viewer-geocoderContainer, .cesium-viewer-homeButton,
    .cesium-viewer-sceneModePicker, .cesium-viewer-navigationHelpButton,
    .cesium-viewer-animationContainer, .cesium-viewer-timelineContainer,
    .cesium-viewer-fullscreenContainer { display: none !important; }
  </style>
</head>
<body>
  <div id="c"></div>
  <script>
    (async () => {
      const p       = new URLSearchParams(location.search);
      const lat     = +p.get('lat');
      const lng     = +p.get('lng');
      const heading = +p.get('heading') || 180;
      const pitch   = +p.get('pitch')   || -50;
      const range   = +p.get('range')   || 130;
      const elev    = +p.get('elev')    || 50;   // terrain elevation in metres
      const apiKey  = p.get('key');

      window.__ready = false;
      window.__error = null;

      // Surface fetch errors
      const _fetch = window.fetch;
      window.fetch = (...a) => _fetch(...a).then(r => {
        if (!r.ok) console.error('fetch ' + r.status + ' ' + (typeof a[0]==='string' ? a[0].slice(0,100) : ''));
        return r;
      }).catch(e => { console.error('fetch err: '+e); throw e; });

      Cesium.Ion.defaultAccessToken = '';
      const viewer = new Cesium.Viewer('c', {
        imageryProvider: false, baseLayerPicker: false, geocoder: false,
        homeButton: false, sceneModePicker: false, navigationHelpButton: false,
        animation: false, timeline: false, fullscreenButton: false,
        infoBox: false, selectionIndicator: false, requestRenderMode: false,
      });
      viewer.scene.globe.show         = false;
      viewer.scene.skyBox.show        = false;
      viewer.scene.skyAtmosphere.show = false;
      viewer.scene.backgroundColor    = Cesium.Color.BLACK;

      // Log WebGL renderer to confirm SwiftShader
      try {
        const gl  = viewer.scene.canvas.getContext('webgl2') || viewer.scene.canvas.getContext('webgl');
        const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
        console.log('renderer: ' + (ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl ? gl.getParameter(gl.RENDERER) : 'none'));
      } catch(e) {}

      try {
        console.log('loading tileset heading=' + heading + ' pitch=' + pitch + ' range=' + range + ' elev=' + elev);
        const tileset = await Cesium.Cesium3DTileset.fromUrl(
          `https://tile.googleapis.com/v1/3dtiles/root.json?key=${apiKey}`,
          { maximumScreenSpaceError: 4, showCreditsOnScreen: false }
        );
        viewer.scene.primitives.add(tileset);

        // Target at terrain elevation (not sea level) to keep camera above ground
        const target = Cesium.Cartesian3.fromDegrees(lng, lat, elev + 5);
        viewer.camera.lookAt(target, new Cesium.HeadingPitchRange(
          Cesium.Math.toRadians(heading),
          Cesium.Math.toRadians(pitch),
          range
        ));
        viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);

        // Wait for tilesLoaded to be stable for 30 consecutive rAF ticks
        let stable = 0;
        await new Promise(resolve => {
          (function tick() {
            viewer.scene.requestRender();
            stable = tileset.tilesLoaded ? stable + 1 : 0;
            if (stable > 30) return resolve();
            requestAnimationFrame(tick);
          })();
          setTimeout(resolve, 25000); // hard cap
        });

        viewer.scene.requestRender();
        window.__ready = true;
        console.log('ready');
      } catch(e) {
        console.error('tileset error: ' + e);
        window.__error = String(e);
        window.__ready = true;
      }
    })();
  </script>
</body>
</html>
